# DocuAsk — self-hosted stack (app + Postgres/pgvector + Redis).
#
# Quick start:
#   cp .env.example .env          # customize secrets if needed
#   docker compose up -d --build
#   open http://localhost:3000
#
# Compose reads `.env` (not `.env.local`) for the ${VARS} below.

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuask_password}
      POSTGRES_DB: ${POSTGRES_DB:-docuask}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docuask} -d ${POSTGRES_DB:-docuask}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "${POSTGRES_PORT:-5433}:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # One-shot schema migration. Idempotent (IF NOT EXISTS / ON CONFLICT), so it
  # is safe to run on every `up`. Runs as the superuser to create the schema and
  # the ordinary app role; the app itself never connects as a superuser.
  migrate:
    image: pgvector/pgvector:pg18
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-docuask_password}
    volumes:
      - ./sql:/sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "[migrate] applying schema…"
        psql -h db -U ${POSTGRES_USER:-docuask} -d ${POSTGRES_DB:-docuask} -v ON_ERROR_STOP=1 -f /sql/schema.sql
        psql -h db -U ${POSTGRES_USER:-docuask} -d ${POSTGRES_DB:-docuask} -v ON_ERROR_STOP=1 -f /sql/billing.sql
        psql -h db -U ${POSTGRES_USER:-docuask} -d ${POSTGRES_DB:-docuask} -v ON_ERROR_STOP=1 -f /sql/accounts.sql
        echo "[migrate] provisioning app role…"
        psql -h db -U ${POSTGRES_USER:-docuask} -d ${POSTGRES_DB:-docuask} -v ON_ERROR_STOP=1 \
          -v app_password="${DOCUASK_APP_PASSWORD:-docuask_app_password}" \
          -f /sql/roles.sql
        echo "[migrate] done."
    restart: "no"

  app:
    build:
      context: .
      # Public origin is inlined into prerendered pages at build time; set it
      # here (and in .env) to your real domain so canonical/OG/robots URLs are
      # absolute. Runtime env alone will NOT change static output.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # App connects as the ordinary role — superusers bypass RLS.
      DATABASE_URL: postgres://docuask_app:${DOCUASK_APP_PASSWORD:-docuask_app_password}@db:5432/${POSTGRES_DB:-docuask}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-cloudflare}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-change-in-production-min-32-chars}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token-change-in-production-min-32-chars}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  db_data:
  redis_data:
